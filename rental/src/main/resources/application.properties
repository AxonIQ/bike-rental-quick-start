spring.application.name=Rental Monolith

spring.h2.console.enabled=true

management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:h2:./.db/rental_db;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update

# Raw Axon Server gRPC endpoint (the connector talks to this directly).
axon.axonserver.host=localhost
axon.axonserver.port=8124
axon.axonserver.context=default