spring.application.name=Rental Monolith

spring.h2.console.enabled=true

management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:h2:./.db/rental_db;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update

# Axon Server Integration HTTP API - where we send commands/queries/events and read aggregates.
axon.axonserver.http-url=http://localhost:8024
axon.axonserver.context=default

# How this application identifies itself to Axon Server, and the base URL at which Axon Server can
# reach it to push commands, queries and events to the /axon/** handler endpoints. When Axon Server
# runs in Docker, set the callback URL to a host reachable from the container, e.g.
# http://host.docker.internal:8080
axon.integration.name=rental
axon.integration.callback-url=http://localhost:8080
